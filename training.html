  <meta charset="UTF-8" />

  <title>Soldier Training Simulator</title>
  <link rel="stylesheet" href="main.css" />

</head>
<body onload="enableSound()">
  <header>
    <h1>🪖 Soldier Training Simulator</h1>
    <nav>
      <ul>
        <li><a href="Index.html">Home</a></li>

  <main>
    <h2>Train your soldier for battle</h2>
    <form onsubmit="return startTraining();">
      <label for="name">Enter Soldier Name:</label>
      <input type="text" id="name" required />

      <label for="stamina">Enter Starting Stamina (1–100):</label>
      <input type="number" id="stamina" min="1" max="100" required />

      <button type="submit">Start Training</button>
    </form>

    <p id="output"></p>
  </main>

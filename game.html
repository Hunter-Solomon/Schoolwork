<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quark's Casino - Snake Game</title>
  <link rel="stylesheet" href="main.css" />
  <script src="sound.js"></script>
  <script src="code.js"></script>
</head>
<body onload="enableSound(); drawBoard();">
  <header>
    <h1 id="heading">🎲 Welcome to Quark's Casino 🎲</h1>

    <!-- Navigation menu -->
    <nav>
      <ul>
        <li><a href="Index.html">Home</a></li>
        <li><a href="Boards.html">Boards</a></li>
        <li><a href="Game.html" aria-current="page">Snake Game</a></li>
        <li><a href="Strings.html">Secret Message</a></li>
        <li><a href="Palindrome.html">Palindrome Checker</a></li>
      </ul>
    </nav>

    <p>Use arrow keys or buttons below to control the snake. Eat the red food to grow!</p>
  </header>

  <!-- Game Board -->
  <main>
    <div id="gameBoard"></div>
    <p id="scoreDisplay">Score: 0</p>

    <!-- D-Pad Control Buttons -->
    <div class="game-controls">
      <div class="dpad">
        <button class="dpad-btn up" onclick="moveSnake('up')">⬆</button>
        <div class="dpad-middle">
          <button class="dpad-btn left" onclick="moveSnake('left')">⬅</button>
          <div class="dpad-center"></div>
          <button class="dpad-btn right" onclick="moveSnake('right')">➡</button>
        </div>
        <button class="dpad-btn down" onclick="moveSnake('down')">⬇</button>
      </div>
    </div>
  </main>

  <footer>
    <p>&copy; 2025 Quark's Casino</p>
  </footer>
</body>
</html>
